function start(){

  var u=usage(),c=u[p]||0;
  if(c>=MAX){e.textContent="该密码使用次数已用完（3/3）";return}
  u[p]=c+1;ss("mt_u",JSON.stringify(u));
  S.pwd=p;S.step=0;resAns();e.textContent="";
  render();page("pQuiz");
}

function render(){
  var i=S.step,q=Q[i];
  $("qn").textContent="第 "+(i+1)+" 题";
  $("qt").textContent=q.q;
  $("pt").textContent=(i+1)+" / "+Q.length;
  $("pf").style.width=(i/Q.length*100)+"%";
  var b=$("opts");b.innerHTML="";
  q.a.forEach(function(o,j){
    var btn=document.createElement("button");
    btn.className="opt"+(S.ans[i]===j?" sel":"");
    btn.textContent=o.t;
    btn.onclick=function(){
      S.ans[i]=j;
      for(var k=0;k<b.children.length;k++)b.children[k].classList.remove("sel");
      btn.classList.add("sel");
    };
    b.appendChild(btn);
  });
  $("prevBtn").disabled=(i===0);
  $("nextBtn").textContent=(i===Q.length-1)?"查看结果":"下一题";
}

  });
  return {sc:sc,id:pick(sc)};
}
function pick(sc){
  var v=[sc.A,sc.B,sc.C,sc.D,sc.E,sc.F];
  var mean=v.reduce(function(a,b){return a+b},0)/6;
  var std=Math.sqrt(v.reduce(function(a,b){return a+Math.pow(b-mean,2)},0)/6);
  var id="R12";
  if(std>=22)id="R11";
  else if(sc.E>=75&&sc.A<=45)id="R9";
  else if(sc.E>=75&&sc.C>=65)id="R7";
  else if(sc.B>=78&&sc.A>=65)id="R3";
  else if(sc.B<=35&&sc.E>=60)id="R1";
  else if(sc.C<=40&&sc.D<=40)id="R2";
  else if(sc.C>=72&&sc.A>=68&&sc.B<=55)id="R4";
  else if(sc.F>=72&&sc.A>=62)id="R8";
  else if(sc.F>=65&&sc.C<65)id="R5";
  else if(sc.E>=68&&sc.A<=45)id="R6";
  else if(sc.A>=62&&sc.D>=58)id="R10";
  return id;
}

function radar(sc){
  var svg=$("rRadar"),cx=150,cy=150,Rr=100;
  var ds=[{k:"A",l:"情绪调节"},{k:"B",l:"社交能量"},{k:"C",l:"自我控制"},{k:"D",l:"意义感"},{k:"E",l:"认知负荷"},{k:"F",l:"自我接纳"}];
  var n=ds.length,h="",i;
  function ang(i){return Math.PI*2/n*i-Math.PI/2}
  function pt(i,r){return [cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r]}
  for(var g=1;g<=4;g++){
    var rr=Rr*g/4,ps=[];
    for(i=0;i<n;i++)ps.push(pt(i,rr).join(","));
    h+='<polygon points="'+ps.join(" ")+'" fill="none" stroke="#f0e0bf"/>';
  }
  for(i=0;i<n;i++){
    var xy=pt(i,Rr);
    h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+xy[0]+'" y2="'+xy[1]+'" stroke="#f0e0bf"/>';
    var lp=pt(i,Rr+24);
    h+='<text x="'+lp[0]+'" y="'+lp[1]+'" font-size="11" fill="#b09468" text-anchor="middle">'+ds[i].l+'</text>';
  }
  var dp=[];
  for(i=0;i<n;i++){
    var v=(sc[ds[i].k]||50)/100,p=pt(i,Rr*v);
    dp.push(p[0]+","+p[1]);
  }
  h+='<polygon points="'+dp.join(" ")+'" fill="rgba(255,171,77,.35)" stroke="#ff9f45" stroke-width="2"/>';
  for(i=0;i<n;i++){
    var s=dp[i].split(",");
    h+='<circle cx="'+s[0]+'" cy="'+s[1]+'" r="3.5" fill="#ff9f45"/>';
  }
  svg.innerHTML=h;
}

function showResult(id,sc){
  var o=R[id];
  $("rE").textContent=o.e;$("rT").textContent=o.n;$("rG").textContent=o.g;
  $("rF").textContent=o.f;$("rTh").textContent=o.t;$("rS").textContent="「"+o.s+"」";
  if(sc)radar(sc);
  page("pRes");
}

function finish(){
  var r=calc();
  var base=location.href.split("?")[0];
  var arr=[r.sc.A,r.sc.B,r.sc.C,r.sc.D,r.sc.E,r.sc.F].join(",");
  try{history.replaceState(null,"",base+"?r="+r.id+"&s="+arr)}catch(e){}
  showResult(r.id,r.sc);
}

$("startBtn").onclick=start;
$("pwd").addEventListener("keydown",function(e){if(e.key==="Enter")start()});
$("prevBtn").onclick=function(){if(S.step>0){S.step--;render()}};
$("nextBtn").onclick=function(){
  if(S.ans[S.step]===null){toast("请先选择一个选项");return}
  if(S.step<Q.length-1){S.step++;render()}else{finish()}
};
$("saveBtn").onclick=function(){
  if(typeof html2canvas==="undefined"){toast("图片库未加载，请联网后重试");return}
  toast("正在生成长图…");
  html2canvas($("resCard"),{backgroundColor:"#fffdf8",scale:2,useCORS:true}).then(function(c){
    c.toBlob(function(b){
      var a=document.createElement("a");
      a.href=URL.createObjectURL(b);a.download="精神状态成分检测.png";
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
      toast("已生成长图，请查看下载");
    });
  }).catch(function(){toast("生成失败，请重试")});
};
$("copyBtn").onclick=function(){
  var u=location.href;
  function done(){toast("链接已复制，去分享吧")}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(done).catch(function(){fb(u,done)});
  }else fb(u,done);
};
function fb(t,cb){
  var a=document.createElement("textarea");
  a.value=t;a.style.position="fixed";a.style.opacity="0";
  document.body.appendChild(a);a.select();
  try{document.execCommand("copy");cb()}catch(e){toast("复制失败，请手动复制")}
  a.remove();
}
$("retryBtn").onclick=function(){
  try{history.replaceState(null,"",location.href.split("?")[0])}catch(e){}
  S.step=0;resAns();page("pPwd");
};

(function(){
  var m=location.search.match(/[?&]r=(R\d+)/);
  var sm=location.search.match(/[?&]s=([\d,]+)/);
  if(m&&R[m[1]]){
    var sc=null;
    if(sm){
      var p=sm[1].split(",").map(Number);
      if(p.length===6&&p.every(function(x){return !isNaN(x)})){
        sc={A:p[0],B:p[1],C:p[2],D:p[3],E:p[4],F:p[5]};
      }
    }
    if(sc){showResult(m[1],sc);}
    else{
      $("rRadar").style.display="none";
      var sts=document.querySelectorAll(".st");
      if(sts[0])sts[0].style.display="none";
      showResult(m[1],null);
    }
    $("saveBtn").style.display="none";
    $("retryBtn").textContent="我也要测";
  }
})();
</script>
